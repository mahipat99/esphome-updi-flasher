# Example using the component straight from GitHub.
esphome:
  name: updi-flasher

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

logger:
  hardware_uart: UART0   # keep UART1/UART2 free for UPDI

external_components:
  - source: github://mahipat99/esphome-updi-flasher@main
    components: [updi_flasher]
    refresh: 1min

updi_flasher:
  pin: GPIO17       # single UPDI wire (GPIO17, GPIO21, TX... all accepted)
  uart_num: 1       # optional: internal UART peripheral (0-2); must not be the logger's
  baud_rate: 115200

# Open http://updi-flasher.local/updi and upload your .hex
