# Example using the component straight from GitHub.
esphome:
  name: updi-flasher

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  hardware_uart: UART0   # keep UART1/UART2 free for UPDI

external_components:
  - source: github://mahipat99/esphome-updi-flasher@main
    components: [updi_flasher]
    refresh: 1min

updi_flasher:
  pin: 17        # single UPDI wire (open-drain, UART tx+rx muxed)
  uart_num: 1       # not the logger UART
  baud_rate: 115200

# Open http://updi-flasher.local/updi and upload your .hex
