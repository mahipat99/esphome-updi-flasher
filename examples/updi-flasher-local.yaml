# Same thing, but using a local copy of the components/ folder (for development).
esphome:
  name: updi-flasher

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  hardware_uart: UART0

external_components:
  - source:
      type: local
      path: ../components
    components: [updi_flasher]

updi_flasher:
  pin: 17        # single UPDI wire (open-drain, UART tx+rx muxed)
  uart_num: 1       # not the logger UART
  baud_rate: 115200
