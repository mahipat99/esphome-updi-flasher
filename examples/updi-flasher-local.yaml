# Same thing, but using a local copy of the components/ folder (for development).
esphome:
  name: updi-flasher

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

logger:
  hardware_uart: UART0

external_components:
  - source:
      type: local
      path: ../components
    components: [updi_flasher]

updi_flasher:
  pin: GPIO17       # single UPDI wire (GPIO17, GPIO21, TX... all accepted)
  uart_num: 1       # optional: internal UART peripheral (0-2); must not be the logger's
  baud_rate: 115200
