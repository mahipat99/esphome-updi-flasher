# Same thing, but using a local copy of the components/ folder (for development).
esphome:
  name: updi-flasher

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  hardware_uart: UART0

external_components:
  - source:
      type: local
      path: ../components
    components: [updi_flasher]

uart:
  id: updi_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200
  parity: EVEN
  stop_bits: 2
  data_bits: 8
  rx_buffer_size: 512

updi_flasher:
  uart_id: updi_uart
